<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - GamesHub</title>
  <link rel="icon" href="../media/logo.svg" type="image/x-icon" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .error-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 16px; }
    .error-code { font-size: 96px; font-weight: 900; background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .error-msg { font-size: 20px; color: var(--text-secondary-color); }
    .error-btn { padding: 10px 24px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="error-wrap">
    <div class="error-code">404</div>
    <div class="error-msg">Page not found</div>
    <a href="/" class="btn btn-primary error-btn">Go Home</a>
  </div>
</body>
</html>
